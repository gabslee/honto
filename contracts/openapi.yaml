        startsAt: { type: string, format: date-time, description: 'max(departsAt, arrivesAt - 8h).' }
        endsAt: { type: string, format: date-time, description: 'arrivesAt + 1h.' }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    Trip:
      type: object
      required: [id, traveler, travelerUserId, departsAt, arrivesAt, fromCity, toCity, phase, liveActivity, createdAt, updatedAt]
      properties:
        id: { type: string }
        traveler: { $ref: '#/components/schemas/Grantee' }
        travelerUserId: { type: string }
        departsAt: { type: string, format: date-time }
        arrivesAt: { type: string, format: date-time }
        fromCity: { type: [string, 'null'], maxLength: 80 }
        toCity: { type: [string, 'null'], maxLength: 80 }
        phase: { $ref: '#/components/schemas/TripPhase' }
        liveActivity: { $ref: '#/components/schemas/TripLiveActivity' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TripInput:
      type: object
      required: [traveler, departsAt, arrivesAt]
      properties:
        traveler: { $ref: '#/components/schemas/Grantee' }
        departsAt: { type: string, format: date-time }
        arrivesAt: { type: string, format: date-time, description: 'After departsAt, at most 48h later.' }
        fromCity: { type: string, maxLength: 80 }
        toCity: { type: string, maxLength: 80 }
    TripPatch:
      type: object
      x-patch: true
      description: Omit a key to keep it; send null to clear a city.
      properties:
        departsAt: { type: string, format: date-time }
        arrivesAt: { type: string, format: date-time }
        fromCity: { type: [string, 'null'], maxLength: 80 }
        toCity: { type: [string, 'null'], maxLength: 80 }
    TripList:
      type: object
      required: [trips]
      properties:
        trips: { type: array, items: { $ref: '#/components/schemas/Trip' } }
    NudgeSource:
      type: string
      enum: [widget, app]
    NudgeRequest:
      type: object
      required: [source]
      properties:
        source: { $ref: '#/components/schemas/NudgeSource' }
        clientId: { type: string, format: uuid, description: 'Idempotency key (widget retries).' }
    NudgeResult:
      type: object
      required: [id, createdAt, nextAllowedAt]
