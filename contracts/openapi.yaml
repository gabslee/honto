    # ---- Non-HTTP contracts (push payloads, Live Activity, widget snapshot). Not referenced by paths. ----
    PushEventType:
      type: string
      enum: [photo.new, nudge.new, couple.joined, couple.unpaired, reunion.changed, trip.start, trip.update, trip.end]
    PushData:
      type: object
      x-contract: push
      description: |
        Custom data carried by every push. FCM: sent as `data` (all values strings; nulls omitted).
        APNs alert: top-level key `honto` next to `aps` (with `mutable-content: 1` for photo.new / nudge.new
        so the NSE refreshes the App Group snapshot). APNs widget push (iOS 26): `{"aps":{"content-changed":true}}` only.
      required: [type, coupleId, sentAt]
      properties:
        type: { $ref: '#/components/schemas/PushEventType' }
        coupleId: { type: string }
        sentAt: { type: string, format: date-time }
        photoId: { type: string }
        thumbUrl: { type: string, format: uri, description: 'Signed thumb URL so the NSE / FCM service can update the widget without an API call.' }
        nudgeId: { type: string }
        createdAt: { type: string, format: date-time, description: 'nudge.new: when the nudge was created (server time), for the receiver widget.' }
        tripId: { type: string }
        fromName: { type: string }
    TripActivityPhase:
      type: string
      enum: [before, inTransit, landed]
    TripActivityAttributes:
      type: object
      x-contract: live-activity
      description: Static attributes; JSON keys must equal the Swift `Codable` names (`attributes-type` = `TripActivityAttributes`).
      required: [tripId, travelerName, waiterName, fromCity, toCity]
      properties:
        tripId: { type: string }
        travelerName: { type: string }
        waiterName: { type: string }
        fromCity: { type: [string, 'null'] }
        toCity: { type: [string, 'null'] }
    TripActivityContentState:
      type: object
      x-contract: live-activity
      description: |
        `content-state` of the APNs liveactivity push. Times are Unix epoch **seconds** (integers) because
        ActivityKit decodes with a default JSONDecoder, whose `Date` strategy is not ISO 8601.
      required: [phase, departsAtEpoch, arrivesAtEpoch, partnerName]
      properties:
        phase: { $ref: '#/components/schemas/TripActivityPhase' }
        departsAtEpoch: { type: integer }
        arrivesAtEpoch: { type: integer }
        partnerName: { type: string }
    WidgetSnapshotPhoto:
      type: object
      x-contract: widget
      required: [photoId, localDay, takenAt, thumbFile, phrase]
      properties:
        photoId: { type: string }
        localDay: { $ref: '#/components/schemas/LocalDay' }
        takenAt: { type: string, format: date-time }
        thumbFile: { type: string, description: 'File name inside the App Group / Android filesDir `widget/` folder (e.g. `partner_thumb.jpg`).' }
        phrase: { type: [string, 'null'] }
    WidgetSnapshot:
      type: object
      x-contract: widget
      description: |
        `snapshot.v1.json` in the App Group (`group.com.hontogame.app`) / Android `filesDir/widget/`.
        Written by Flutter (Pigeon `WidgetsHostApi`), the NSE and the Android FCM service; read by the widgets
        and the nudge App Intent. Derived from `GET /api/v1/today`. Breaking change = new version + new file name.
      required: [version, generatedAt, paired, premium, me, partner, startedOn, reunion, nudges]
      properties:
        version: { type: integer, description: 'Always 1 for this file.' }
        generatedAt: { type: string, format: date-time }
        paired: { type: boolean }
        premium: { type: boolean }
        me: { $ref: '#/components/schemas/WidgetSnapshotMe' }
        partner: { anyOf: [{ $ref: '#/components/schemas/WidgetSnapshotPartner' }, { type: 'null' }] }
        startedOn: { anyOf: [{ $ref: '#/components/schemas/LocalDay' }, { type: 'null' }] }
        reunion: { anyOf: [{ $ref: '#/components/schemas/WidgetSnapshotReunion' }, { type: 'null' }] }
        nudges: { $ref: '#/components/schemas/NudgeState' }
        streak: { anyOf: [{ $ref: '#/components/schemas/WidgetSnapshotStreak' }, { type: 'null' }], description: 'Couple streak from `/today` (optional; absent in older snapshots).' }
    WidgetSnapshotStreak:
      type: object
      x-contract: widget
      required: [current, best, todayComplete]
      properties:
        current: { type: integer, minimum: 0 }
        best: { type: integer, minimum: 0 }
        todayComplete: { type: boolean }
    WidgetSnapshotMe:
      type: object
      x-contract: widget
      required: [displayName, postedToday]
      properties:
        displayName: { type: string }
        postedToday: { type: boolean }
        weather: { anyOf: [{ $ref: '#/components/schemas/WeatherSummary' }, { type: 'null' }], description: 'Optional; absent in older snapshots.' }
    WidgetSnapshotPartner:
      type: object
      x-contract: widget
      required: [displayName, timeZone, photo, status]
      properties:
        displayName: { type: string }
        timeZone: { anyOf: [{ $ref: '#/components/schemas/TimeZoneId' }, { type: 'null' }] }
        photo: { anyOf: [{ $ref: '#/components/schemas/WidgetSnapshotPhoto' }, { type: 'null' }] }
        status: { anyOf: [{ $ref: '#/components/schemas/PartnerStatus' }, { type: 'null' }] }
        weather: { anyOf: [{ $ref: '#/components/schemas/WeatherSummary' }, { type: 'null' }], description: 'Optional; absent in older snapshots.' }
    WidgetSnapshotReunion:
      type: object
      x-contract: widget
      required: [at, city]
      properties:
        at: { type: string, format: date-time }
        city: { type: [string, 'null'] }
