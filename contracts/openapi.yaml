openapi: 3.1.0
info:
  title: Honto API v1
  version: 1.0.0-w0
  summary: Contract for the Honto MVP apps (Flutter iOS/Android) and the read-only web at hontogame.com/app.
  description: |
    Source of truth for `/api/v1`. TypeScript types (`contracts/honto-api.ts`), Dart models
    (`contracts/dart/lib/src/models.g.dart`) and the widget snapshot schema are generated from this file
    by `npm run contracts:generate`; `npm run contracts:check` fails when they drift.

    Conventions
    - JSON only, `Cache-Control: no-store` on every response.
    - Errors: `{ "error": "Human readable", "code": "<ErrorCode>" }` (same shape as `/api/mobile`).
    - Timestamps are RFC 3339 in UTC (`2026-10-19T15:04:05Z`). Local calendar days are `YYYY-MM-DD`
      strings (`LocalDay`) and are never converted between zones by clients.
    - The API returns data, never UI copy ("Busy until 3 PM" is formatted on the client, in English).
    - Both partners must be signed in (Google, Apple or email magic link). `/api/mobile/*` and the
      account-free partner stay frozen for app build 2 and the web game; the new app only uses `/api/v1`.
    - Auth: `Authorization: Bearer hm_u_…` (apps; widget/NSE/App Intent share it via the keychain group)
      or the `honto_session` cookie (web, read-only screens).
    - Photos live in a private S3-compatible bucket (object storage; currently Railway Storage Buckets).
      Uploads are presigned PUTs, reads are presigned GETs (SigV4, service `s3`, region `auto`).
      Photo and memories endpoints answer `503 storage_not_configured` while the bucket credentials are unset.
    - Premium is per couple: the couple is Premium when either member has an active entitlement.
    - Clients: iOS 17.0+ (portrait only; push-to-start Live Activities need 17.2, widget push needs 26),
      Android minSdk 26 (proposal), web read-only.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: Honto
    url: https://hontogame.com
servers:
  - url: https://hontogame.com
    description: Production
  - url: http://localhost:4010
    description: Mock server (`npm run contracts:mock`)
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: auth
    description: 'Sign-in (Google, Apple, email magic link) and logout.'
  - name: me
    description: 'Current account, time zone, export, deletion.'
  - name: couple
    description: 'Pairing by code, couple details, unpairing.'
  - name: today
    description: 'Today screen and widget data.'
  - name: photos
    description: 'Daily photos via presigned uploads to private S3-compatible object storage.'
  - name: memories
    description: 'Monthly history and day detail.'
  - name: milestones
    description: 'Couple milestones (celebrations, Free) listed in Memories.'
  - name: devices
    description: 'Push tokens (FCM, APNs alert/widget) and Live Activity tokens.'
  - name: calendar
    description: 'Busy/free mirror and per-calendar title opt-in (Premium).'
  - name: trips
    description: 'Reunion trips that drive the Live Activity / Live Update.'
  - name: nudges
    description: '"Thinking of you" (Free).'
  - name: billing
    description: 'RevenueCat webhook.'
  - name: cron
    description: 'Called by the Cloudflare Worker cron.'
paths:
  /api/v1/auth/google:
    post:
      tags: [auth]
      operationId: signInWithGoogle
      summary: Native Google Sign-In; returns an hm_u_ token.
      description: |
        The ID token is verified with the Google JWKS; audience = the web, iOS or Android client id.
        `email_verified` must be true (`400 email_required` otherwise).
        Account matching (same Honto account as the web game and `/api/mobile`): the provider subject already
        linked to a user; else an existing user with the same email (case-insensitive), only when the provider
        marks it verified, and the subject is then linked to that user (existing and Premium accounts are
        relinked, never duplicated); else a new user (201). `400 email_required` when no linked subject and no
        verified email. Returns the same opaque `hm_u_` token as the email login, plus a refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleSignInRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '201': { $ref: '#/components/responses/AuthSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/apple:
    post:
      tags: [auth]
      operationId: signInWithApple
      summary: Native Sign in with Apple; returns an hm_u_ token.
      description: |
        Apple only shares name/email on the first sign-in, so send `name` then. The identity token is verified
        with the Apple JWKS; audience = the bundle id `com.hontogame.app`.
        Account matching (same Honto account as the web game and `/api/mobile`): the provider subject already
        linked to a user; else an existing user with the same email (case-insensitive), only when the provider
        marks it verified, and the subject is then linked to that user (existing and Premium accounts are
        relinked, never duplicated); else a new user (201). `400 email_required` when no linked subject and no
        verified email. Returns the same opaque `hm_u_` token as the email login, plus a refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppleSignInRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '201': { $ref: '#/components/responses/AuthSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/link/{provider}:
    post:
      tags: [auth]
      operationId: linkProviderIdentity
      summary: Add a Google or Apple sign-in to the signed-in account.
      description: |
        Validates the native ID token like `POST /api/v1/auth/{provider}` and links its subject to the caller, so a
        user who signed in with Apple "Hide My Email" can also sign in with Google (or the reverse) and land on
        the same account. Identities are never moved: `409 identity_in_use` when the subject already belongs to
        another account. 201 linked now, 200 already linked to me (idempotent).
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/LinkProvider' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderLinkRequest' }
      responses:
        '200':
          description: Already linked to this account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderLinkResult' }
        '201':
          description: Linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderLinkResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/email/start:
    post:
      tags: [auth]
      operationId: startEmailSignIn
      summary: Send a magic link plus a 6-digit fallback code.
      description: |
        The email links to `https://hontogame.com/auth/email?token=…` (universal link / App Link opens the
        app; on the web the page calls verify). Single use, 15 min, stored hashed. Always answers 202 for a
        well-formed address (no account enumeration). `503 email_unavailable` when the server has no email
        provider configured (the app then offers Apple / Google instead).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailStartRequest' }
      responses:
        '202':
          description: Email queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailStartResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmailSignIn
      summary: Exchange the magic-link token (or email + code) for a session.
      description: |
        Send either `token` (from the link) or `email` + `code`. With `platform: web` the server sets the
        `honto_session` cookie and returns `token: null`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerifyRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '201': { $ref: '#/components/responses/AuthSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate a refresh token for a new hm_u_ access token (instead of sending the user back to sign-in).
      description: |
        Call it when a request answers 401 `unauthorized`. Send the `refreshToken` from the last sign-in or
        refresh (and, if still held, the old access token as `Authorization: Bearer hm_u_…`, which is revoked).
        Rotation: every refresh token works once; the answer carries a new access token and a new refresh token.
        Presenting a refresh token that was already used revokes its whole chain (possible theft): sign in again.
        `401 invalid_token` when unknown, expired, reused or revoked. Refresh tokens are issued to the apps
        (`ios` / `android`) only, never to `platform: web`. 30 calls per IP per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (or clear the web cookie).
      description: With a bearer `hm_u_`, also revokes the refresh-token chain issued with it. With the cookie, deletes the web session.
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user, couple (or null), entitlement and pending-unpair state.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Delete the account (App Store 5.1.1(v)).
      description: |
        Unpairs first (same rules as `DELETE /api/v1/couple`), revokes every token and device, then
        deletes the user's photos and profile photo immediately (no 30-day grace for a deleted account).
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [me]
      operationId: updateProfile
      summary: Edit my profile (display name).
      description: |
        Fixes a name typed wrong at sign-in. The partner sees the new name on their next read of
        `/api/v1/couple`, `/api/v1/me` or `/api/v1/today`. Couple fields (start date, reunion) are edited with
        `PATCH /api/v1/couple`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me/avatar:
    delete:
      tags: [me]
      operationId: deleteAvatar
      summary: Remove my profile photo (the objects are deleted from storage).
      responses:
        '204': { description: Removed (also when there was none). }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me/avatar/upload:
    post:
      tags: [me]
      operationId: createAvatarUpload
      summary: Reserve a profile photo and get presigned PUT URLs (full + thumb), like `POST /api/v1/photos`.
      description: |
        The device crops to a square, compresses (long side 1024 px or less) and makes a 256 px thumbnail.
        Upload both with `PUT` using exactly the returned `headers` (10 min), then call
        `POST /api/v1/me/avatar/complete`. Works without a partner. 20 reservations per hour.
        Shown next to the user's name in the app (comments, profile); not used by widgets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarUploadRequest' }
      responses:
        '201':
          description: Reserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarUploadResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageNotConfigured' }
  /api/v1/me/avatar/complete:
    post:
      tags: [me]
      operationId: completeAvatar
      summary: Confirm both uploads; the photo becomes my profile photo and the previous one is deleted.
      description: |
        The server `HEAD`s both objects and checks the declared sizes and types (`422 upload_missing` /
        `upload_size_mismatch` / `unsupported_media_type`). Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarCompleteRequest' }
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avatar' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/StorageNotConfigured' }
  /api/v1/me/timezone:
    put:
      tags: [me]
      operationId: updateTimeZone
      summary: Report the device IANA time zone (sent on every app open/foreground).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimeZoneUpdate' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeZoneResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me/weather:
    put:
      tags: [me]
      operationId: reportWeather
      summary: Report the weather where I am now (coarse summary only, never coordinates).
      description: |
        The app reads a coarse location on the device, asks Apple WeatherKit on the device and
        sends only this summary, so the partner sees "It's raining over there today". The
        server stores no location at all. Summaries older than 12 h are not returned in `/today`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeatherSummary' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeatherSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [me]
      operationId: clearWeather
      summary: Forget my weather summary (location turned off).
      responses:
        '204': { description: Cleared. }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me/export:
    get:
      tags: [me]
      operationId: getExport
      summary: Status of the export of my own photos (ZIP).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportStatus' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [me]
      operationId: requestExport
      summary: Build a ZIP with my own photos.
      description: |
        Available while paired and during the 30 days after unpairing. Built asynchronously into
        `exports/` in object storage; poll `GET /api/v1/me/export`. `url` is a signed GET valid 24h. The bucket has no lifecycle rules: the retention cron deletes export
        objects 7 days after they are ready. `410 export_unavailable` when there is nothing to export (never
        paired, the 30 days are over, or no photos); `503 missing_config` while object storage is not configured.
      responses:
        '202':
          description: Export queued (or already ready; see `status`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/couple/invite:
    get:
      tags: [couple]
      operationId: getInvite
      summary: My current unexpired invite, if any.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      tags: [couple]
      operationId: createInvite
      summary: Create a pairing code (replaces my previous unused code).
      description: Codes are 6 characters (Crockford base32, no 0/O/1/I/L/U), valid 48h, single use. One active code per user.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/couple/join:
    post:
      tags: [couple]
      operationId: joinCouple
      summary: Pair with the account that created the code.
      description: |
        Errors: `404 invalid_code`, `410 code_expired`, `409 already_paired` (either side),
        `422 own_invite`. On success both members get push `couple.joined`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRequest' }
      responses:
        '201':
          description: Paired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Couple' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/couple:
    get:
      tags: [couple]
      operationId: getCouple
      summary: Partner (name, time zone), start date, next reunion and derived counters.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Couple' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    patch:
      tags: [couple]
      operationId: updateCouple
      summary: Set the relationship start date and/or the next reunion. `null` clears.
      description: Changing the reunion sends `reunion.changed` (widget push only) to the partner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouplePatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Couple' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [couple]
      operationId: unpairCouple
      summary: Unpair.
      description: |
        The shared history (couple, reunion, trips, calendar blocks, nudges, the partner's photos) disappears
        immediately for both. Each partner keeps their **own** photos read-only and exportable for 30 days
        (`photosAvailableUntil`); the daily retention job then deletes them from object storage and the database.
        The partner receives push `couple.unpaired`. Live Activities for the couple are ended.
      responses:
        '200':
          description: Unpaired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnpairResult' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/today:
    get:
      tags: [today]
      operationId: getToday
      summary: One call for the Today screen and for the widgets (timeline fetch, NSE, Android service).
      description: |
        Days are computed per person: `me.localDay` in my time zone, `partner.localDay` in theirs (the photo's
        day is the photographer's local day). `partner.latestPhoto` keeps the photo widget filled when the
        partner has not posted yet today. Supports `ETag` / `If-None-Match` (304) so widgets can poll cheaply.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Today' }
        '304': { description: Not modified. }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/photos:
    post:
      tags: [photos]
      operationId: createPhoto
      summary: Reserve a photo and get presigned PUT URLs (full + thumb) in the private object storage bucket.
      description: |
        The device compresses (long side 1080 px, ~200 KB) and generates the 320 px thumbnail itself.
        Upload both with `PUT` using exactly the returned `headers`, then call `complete`. URLs expire in 10 min.
        `localDay` is the photographer's local day and must be within ±1 day of the server's "today" in
        `timeZone` (else `422 invalid_local_day`). Retrying with the same `clientId` returns the same photo
        with fresh URLs (idempotent).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoCreateRequest' }
      responses:
        '201':
          description: Reserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoCreateResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/StorageNotConfigured' }
  /api/v1/photos/{photoId}/complete:
    post:
      tags: [photos]
      operationId: completePhoto
      summary: Confirm both uploads; the photo becomes `ready` and the partner gets `photo.new`.
      description: |
        The server `HEAD`s both objects and checks the sizes declared at creation (`422 upload_missing` /
        `upload_size_mismatch`). The first photo of each author per `localDay` to become ready is the
        daily photo (`isDaily: true`); later ones go to that day's gallery. Idempotent.
      parameters:
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/StorageNotConfigured' }
  /api/v1/photos/{photoId}:
    delete:
      tags: [photos]
      operationId: deletePhoto
      summary: Delete one of my photos (author only). If it was the daily photo, the next one is promoted.
      parameters:
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/StorageNotConfigured' }
  /api/v1/memories:
    get:
      tags: [memories]
      operationId: getMemoriesMonth
      summary: Month grid with both daily thumbnails per day.
      description: |
        Free couples see the last 7 days (today in my time zone and the 6 before); older days are returned
        with `locked: true` and no thumbnails so the UI can show the paywall on tap.
      parameters:
        - name: month
          in: query
          required: true
          schema: { $ref: '#/components/schemas/YearMonth' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoriesMonth' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/StorageNotConfigured' }
  /api/v1/memories/{day}:
    get:
      tags: [memories]
      operationId: getMemoryDay
      summary: All ready photos of both partners for a local day (daily first, then gallery by time).
      description: '`403 premium_required` for a locked day on Free.'
      parameters:
        - name: day
          in: path
          required: true
          schema: { $ref: '#/components/schemas/LocalDay' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDay' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/StorageNotConfigured' }
  /api/v1/devices:
    post:
      tags: [devices]
      operationId: registerDevice
      summary: Register or refresh a push token (upsert by token).
      description: |
        `fcm` (Android), `apns_alert` (iOS alerts + NSE) and `apns_widget` (iOS 26 `WidgetPushHandler`).
        APNs tokens must include `env` (`sandbox` for debug builds, `production` for TestFlight/App Store).
        Re-registering the same `installationId` + `kind` replaces the previous token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/devices/{deviceId}:
    delete:
      tags: [devices]
      operationId: unregisterDevice
      summary: Revoke a push token (logout, notifications disabled).
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/live-activity/tokens:
    post:
      tags: [devices]
      operationId: registerLiveActivityToken
      summary: Register an iOS Live Activity token (push-to-start, iOS 17.2+, or per-activity update).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveActivityTokenRequest' }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveActivityToken' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/live-activity/tokens/{tokenId}:
    delete:
      tags: [devices]
      operationId: revokeLiveActivityToken
      summary: Revoke a Live Activity token (activity ended or dismissed locally).
      parameters:
        - name: tokenId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/calendar/busy:
    put:
      tags: [calendar]
      operationId: uploadCalendarBusy
      summary: Atomically replace my busy blocks for a window (max 14 days ahead).
      description: |
        Mirror from EventKit / CalendarContract. The client merges overlapping events without shared titles
        and skips free/transparent events. All-day events never count as busy: send none, and any block with
        `allDay: true` is dropped (`ignoredAllDay`). Titles are stored only when the couple is Premium and the
        block's `calendarRef` is opted in via `PUT /calendar/shares`, and never for events the OS marks
        private; otherwise they are dropped (`droppedTitles`). Titles are truncated to 80 chars. Uploading is
        allowed on Free (so data is ready when the trial starts); reading is Premium.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarBusyUpload' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarBusyResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/calendar:
    get:
      tags: [calendar]
      operationId: getCalendar
      summary: My blocks and my partner's, plus the partner's current status. Premium.
      description: A couple without Premium gets 402 `premium_required` (uploading stays allowed on Free).
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: At most 14 days after `from`.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/calendar/shares:
    get:
      tags: [calendar]
      operationId: getCalendarShares
      summary: My per-calendar title opt-ins.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarShares' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [calendar]
      operationId: updateCalendarShares
      summary: Replace my per-calendar title opt-ins (default off). Turning one on requires Premium.
      description: Turning a calendar off deletes the titles already stored for it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarSharesUpdate' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarShares' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/trips:
    get:
      tags: [trips]
      operationId: listTrips
      summary: Upcoming and in-progress trips of the couple.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripList' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      tags: [trips]
      operationId: createTrip
      summary: Add the reunion trip ("I'm traveling" / "They're traveling").
      description: |
        Any couple can save a trip; the Live Activity (iOS) / Live Update (Android) is Premium and starts at
        `max(departsAt, arrivesAt - 8h)` for both partners, ending at `arrivesAt + 1h`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/trips/{tripId}:
    patch:
      tags: [trips]
      operationId: updateTrip
      summary: Change a trip (sends `trip.update` if its Live Activity is running).
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripPatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [trips]
      operationId: deleteTrip
      summary: Cancel a trip (sends `trip.end` if its Live Activity is running).
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/milestones:
    get:
      tags: [milestones]
      operationId: listMilestones
      summary: Milestones the couple reached (Free), for Memories and the CelebrationSheet.
      description: |
        Recorded once per couple, ascending by `localDay` (the day the milestone belongs to in Memories).
        Types: `first_photo` (first ready photo of the couple), `days_together` (`value` 100), `anniversary`
        (`value` = years since `startedOn`), `reunion` (the reunion day of the countdown is reached; one per
        reunion date) and `streak` (`value` 7, 30 or 100 consecutive days with both daily photos). Date
        milestones only count from the day the couple paired, so a couple together for years does not get a
        burst of past anniversaries. Milestones are detected when this endpoint or `GET /api/v1/today` is
        read. `seenAt` is per user: show the CelebrationSheet for each milestone with `seenAt: null`, then
        call `POST /api/v1/milestones/{milestoneId}/seen`. `unseen=true` returns only those.
      parameters:
        - name: unseen
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
          description: '`true` = only milestones I have not seen yet.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MilestoneList' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/milestones/{milestoneId}/seen:
    post:
      tags: [milestones]
      operationId: markMilestoneSeen
      summary: Mark a milestone as seen by me (the CelebrationSheet was shown). Idempotent.
      description: The first `seenAt` is kept on repeats. My partner's `seenAt` is independent.
      parameters:
        - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Milestone' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/nudges:
    post:
      tags: [nudges]
      operationId: sendNudge
      summary: '"Thinking of you" (Free). Sends an alert + widget refresh to the partner.'
      description: Rate limit 1 per 60 s and 30 per day per user (`429 rate_limited` with `Retry-After`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NudgeRequest' }
      responses:
        '201':
          description: Sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NudgeResult' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/billing/revenuecat:
    post:
      tags: [billing]
      operationId: revenueCatWebhook
      summary: RevenueCat webhook → entitlements.
      description: |
        RevenueCat sends the configured `Authorization` header value (`REVENUECAT_WEBHOOK_SECRET`; while it is
        unset every request gets 401). The app calls `Purchases.logIn(<Honto user id>)`, so `app_user_id` is
        the Honto `users.id`. Entitlement id `premium`; the 7-day free trial is the store intro offer (`period_type: TRIAL`). Idempotent by `event.id`.
        Unknown event types are acknowledged and ignored.
      security:
        - revenueCatAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevenueCatWebhook' }
      responses:
        '200':
          description: Acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookAck' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/cron/trips:
    get:
      tags: [cron]
      operationId: cronTrips
      summary: Every 5 min from the Cloudflare Worker (Cron Trigger). Starts/updates/ends Live Activities and Live Updates.
      security:
        - cronAuth: []
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CronTripsResult' }
        '401': { $ref: '#/components/responses/Error' }
  /api/cron/retention:
    get:
      tags: [cron]
      operationId: cronRetention
      summary: Daily from the Cloudflare Worker. Purges unpaired photos after 30 days, expired exports, old calendar blocks and dead tokens.
      security:
        - cronAuth: []
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CronRetentionResult' }
        '401': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque `hm_u_…` token (256-bit, stored as SHA-256 hash, 365 days, revocable).
    cookieAuth:
      type: apiKey
      in: cookie
      name: honto_session
      description: Web session (read-only screens of hontogame.com/app).
    revenueCatAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Exact value configured in the RevenueCat dashboard (`REVENUECAT_WEBHOOK_SECRET`).
    cronAuth:
      type: http
      scheme: bearer
      description: '`CRON_SECRET`, sent by the Cloudflare Worker.'
  parameters:
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string }
    MilestoneId:
      name: milestoneId
      in: path
      required: true
      schema: { type: string }
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
  headers:
    RetryAfter:
      description: Seconds until the next attempt is allowed.
      schema: { type: integer }
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StorageNotConfigured:
      description: Object storage is not configured (the S3_* settings, e.g. the bucket keys, are missing). Retry later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: Photo storage is not configured yet.
            code: storage_not_configured
    AuthSession:
      description: Signed in (200 existing account, 201 new account).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthSession' }
  schemas:
    LocalDay:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: A calendar day in some person's local time zone (never converted).
      examples: ['2026-10-19']
    YearMonth:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      examples: ['2026-10']
    TimeZoneId:
      type: string
      minLength: 1
      maxLength: 64
      description: IANA time zone id.
      examples: ['America/Sao_Paulo']
    ErrorCode:
      type: string
      enum:
        - bad_request
        - unauthorized
        - invalid_token
        - forbidden
        - not_found
        - not_paired
        - already_paired
        - invalid_code
        - code_expired
        - own_invite
        - premium_required
        - rate_limited
        - too_large
        - unsupported_media_type
        - invalid_local_day
        - upload_missing
        - upload_size_mismatch
        - email_required
        - email_unavailable
        - identity_in_use
        - export_unavailable
        - missing_config
        - storage_not_configured
        - internal
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: 'Human readable (English). Do not show raw to users.' }
        code: { $ref: '#/components/schemas/ErrorCode' }
        retryAfterSeconds: { type: [integer, 'null'], minimum: 0 }
    Platform:
      type: string
      enum: [ios, android, web]
    AuthPlatform:
      type: string
      enum: [ios, android]
    User:
      type: object
      required: [id, email, displayName, timeZone, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string, maxLength: 80 }
        timeZone: { anyOf: [{ $ref: '#/components/schemas/TimeZoneId' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        avatar: { anyOf: [{ $ref: '#/components/schemas/Avatar' }, { type: 'null' }], description: 'My profile photo (null when none). Set on `GET /api/v1/me` and `PATCH /api/v1/me`; absent on sign-in responses and older servers.' }
    AuthSession:
      type: object
      required: [token, tokenType, expiresInDays, created, user]
      properties:
        token: { type: [string, 'null'], description: '`hm_u_…`; null for `platform: web` (cookie set instead).' }
        tokenType: { type: string, description: 'Always `Bearer`.' }
        expiresInDays: { type: integer }
        created: { type: boolean, description: 'True when the account was created by this sign-in.' }
        user: { $ref: '#/components/schemas/User' }
        refreshToken: { type: [string, 'null'], description: '`hm_r_…`, single use (see `POST /api/v1/auth/refresh`). Null or absent for `platform: web` and for sign-ins that do not issue one yet.' }
        refreshExpiresInDays: { type: [integer, 'null'], description: 'Lifetime of `refreshToken`; every refresh issues a new one.' }
        isNewUser: { type: boolean, description: 'Google / Apple sign-in: the account was created now (same as `created`). Suggest linking another sign-in.' }
        usedPrivateRelayEmail: { type: boolean, description: 'Google / Apple sign-in: the account email is an Apple "Hide My Email" address (`@privaterelay.appleid.com`), so it will not match the person''s real email later. Suggest linking Google.' }
    LinkProvider:
      type: string
      enum: [apple, google]
    ProviderLinkRequest:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string }
        nonce: { type: string, description: 'Raw nonce, when the app sent one to the provider.' }
    ProviderLinkResult:
      type: object
      required: [provider, alreadyLinked, email, usedPrivateRelayEmail]
      properties:
        provider: { $ref: '#/components/schemas/LinkProvider' }
        alreadyLinked: { type: boolean }
        email: { type: [string, 'null'], description: 'Email in the provider token, if any (the account email is not changed).' }
        usedPrivateRelayEmail: { type: boolean }
    RefreshRequest:
      type: object
      required: [refreshToken, platform]
      properties:
        refreshToken: { type: string, maxLength: 128 }
        platform: { $ref: '#/components/schemas/AuthPlatform' }
    GoogleSignInRequest:
      type: object
      required: [idToken, platform]
      properties:
        idToken: { type: string }
        nonce: { type: string, description: 'Raw nonce, optional.' }
        platform: { $ref: '#/components/schemas/AuthPlatform' }
    AppleSignInRequest:
      type: object
      required: [idToken, platform]
      properties:
        idToken: { type: string }
        nonce: { type: string }
        name: { type: string, maxLength: 80 }
        platform: { $ref: '#/components/schemas/AuthPlatform' }
    EmailStartRequest:
      type: object
      required: [email, platform]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        platform: { $ref: '#/components/schemas/Platform' }
        locale: { type: string, maxLength: 16 }
    EmailStartResponse:
      type: object
      required: [sent, expiresInSeconds, resendAfterSeconds]
      properties:
        sent: { type: boolean }
        expiresInSeconds: { type: integer, description: '900' }
        resendAfterSeconds: { type: integer }
    EmailVerifyRequest:
      type: object
      required: [platform]
      description: Either `token`, or `email` + `code`.
      properties:
        token: { type: string }
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$' }
        name: { type: string, maxLength: 80, description: 'Display name for a new account.' }
        platform: { $ref: '#/components/schemas/Platform' }
    LogoutResponse:
      type: object
      required: [revoked]
      properties:
        revoked: { type: boolean }
    EntitlementSource:
      type: string
      enum: [revenuecat, stripe, admin]
      description: '`stripe` = legacy web subscriber of the game (still honored); the web does not sell in the MVP.'
    PeriodType:
      type: string
      enum: [trial, intro, normal]
    Grantee:
      type: string
      enum: [me, partner]
    Features:
      type: object
      description: Resolved for the couple. Free always has pairing, daily photo, photo widget, countdown, partner time and nudge.
      required: [fullHistory, calendar, eventTitles, liveActivity, countdownWidget, nudge]
      properties:
        fullHistory: { type: boolean }
        calendar: { type: boolean }
        eventTitles: { type: boolean }
        liveActivity: { type: boolean }
        countdownWidget: { type: boolean }
        nudge: { type: boolean }
    Entitlement:
      type: object
      required: [premium, source, productId, periodType, expiresAt, willRenew, grantedBy, trialEligible, features]
      properties:
        premium: { type: boolean }
        source: { anyOf: [{ $ref: '#/components/schemas/EntitlementSource' }, { type: 'null' }] }
        productId: { type: [string, 'null'], examples: ['honto_premium_annual'] }
        periodType: { anyOf: [{ $ref: '#/components/schemas/PeriodType' }, { type: 'null' }] }
        expiresAt: { type: [string, 'null'], format: date-time }
        willRenew: { type: [boolean, 'null'] }
        grantedBy: { anyOf: [{ $ref: '#/components/schemas/Grantee' }, { type: 'null' }], description: 'Which member pays.' }
        trialEligible: { type: boolean, description: 'Hint only; the store decides. False once either member had a trial.' }
        features: { $ref: '#/components/schemas/Features' }
    PartnerInfo:
      type: object
      required: [userId, displayName, timeZone, utcOffsetMinutes, timeZoneUpdatedAt]
      properties:
        userId: { type: string }
        displayName: { type: string }
        timeZone: { anyOf: [{ $ref: '#/components/schemas/TimeZoneId' }, { type: 'null' }], description: 'Use with the device tz database for the partner''s local time.' }
        utcOffsetMinutes: { type: [integer, 'null'], description: 'Offset at response time; hint for clients without tz data.' }
        timeZoneUpdatedAt: { type: [string, 'null'], format: date-time }
        avatar: { anyOf: [{ $ref: '#/components/schemas/Avatar' }, { type: 'null' }], description: 'Partner''s profile photo (null when none). Optional: absent on older servers.' }
    Reunion:
      type: object
      required: [at, city, timeZone, daysUntil]
      properties:
        at: { type: string, format: date-time }
        city: { type: [string, 'null'], maxLength: 80 }
        timeZone: { anyOf: [{ $ref: '#/components/schemas/TimeZoneId' }, { type: 'null' }], description: 'Zone of the meeting place, for display.' }
        daysUntil: { type: integer, description: 'Calendar days from today (viewer tz) to `at`; 0 = today, negative = past.' }
    ReunionInput:
      type: object
      required: [at]
      properties:
        at: { type: string, format: date-time }
        city: { type: [string, 'null'], maxLength: 80 }
        timeZone: { anyOf: [{ $ref: '#/components/schemas/TimeZoneId' }, { type: 'null' }] }
    Couple:
      type: object
      required: [id, pairedAt, startedOn, daysTogether, partner, reunion, premium]
      properties:
        id: { type: string }
        pairedAt: { type: string, format: date-time }
        startedOn: { anyOf: [{ $ref: '#/components/schemas/LocalDay' }, { type: 'null' }] }
        daysTogether: { type: [integer, 'null'], description: 'Days since `startedOn` in the viewer''s tz.' }
        partner: { $ref: '#/components/schemas/PartnerInfo' }
        reunion: { anyOf: [{ $ref: '#/components/schemas/Reunion' }, { type: 'null' }] }
        premium: { type: boolean }
    CouplePatch:
      type: object
      x-patch: true
      description: Omit a key to keep it; send null to clear it.
      properties:
        startedOn: { anyOf: [{ $ref: '#/components/schemas/LocalDay' }, { type: 'null' }] }
        reunion: { anyOf: [{ $ref: '#/components/schemas/ReunionInput' }, { type: 'null' }] }
    Invite:
      type: object
      required: [code, url, expiresAt]
      properties:
        code: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{6}$', examples: ['K7Q2XM'] }
        url: { type: string, format: uri, examples: ['https://hontogame.com/j/K7Q2XM'] }
        expiresAt: { type: string, format: date-time }
    JoinRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: 'Case-insensitive; spaces and dashes ignored.' }
    UnpairResult:
      type: object
      required: [unpairedAt, photosAvailableUntil]
      properties:
        unpairedAt: { type: string, format: date-time }
        photosAvailableUntil: { type: string, format: date-time }
    ExportState:
      type: string
      enum: [none, pending, ready, expired, unavailable]
    ExportStatus:
      type: object
      required: [status, url, expiresAt, photoCount, photosAvailableUntil]
      properties:
        status: { $ref: '#/components/schemas/ExportState' }
        url: { type: [string, 'null'], format: uri, description: 'Signed GET of the ZIP, valid 24h.' }
        expiresAt: { type: [string, 'null'], format: date-time }
        photoCount: { type: integer }
        photosAvailableUntil: { type: [string, 'null'], format: date-time, description: 'Set after unpairing.' }
    UnpairState:
      type: object
      required: [unpairedAt, photosAvailableUntil]
      properties:
        unpairedAt: { type: string, format: date-time }
        photosAvailableUntil: { type: string, format: date-time }
    Me:
      type: object
      required: [user, couple, entitlement, pendingUnpair, hasPendingInvite]
      properties:
        user: { $ref: '#/components/schemas/User' }
        couple: { anyOf: [{ $ref: '#/components/schemas/Couple' }, { type: 'null' }] }
        entitlement: { $ref: '#/components/schemas/Entitlement' }
        pendingUnpair: { anyOf: [{ $ref: '#/components/schemas/UnpairState' }, { type: 'null' }], description: 'Set during the 30 days after an unpair while my photos are kept.' }
        hasPendingInvite: { type: boolean }
    TimeZoneUpdate:
      type: object
      required: [timeZone]
      properties:
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
    TimeZoneResult:
      type: object
      required: [timeZone, updatedAt]
      properties:
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        updatedAt: { type: string, format: date-time }
    PhotoAuthor:
      type: string
      enum: [me, partner]
    PhotoStatus:
      type: string
      enum: [pending, ready]
    PhotoContentType:
      type: string
      enum: [image/jpeg, image/webp]
    PhotoUrls:
      type: object
      required: [full, thumb, expiresAt]
      properties:
        full: { type: string, format: uri, description: 'Presigned S3 GET (private bucket, virtual-host style URL), 24h. Cache by photo id, not URL.' }
        thumb: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    Photo:
      type: object
      required: [id, author, authorUserId, localDay, isDaily, status, phraseKey, phrase, width, height, createdAt, urls]
      properties:
        id: { type: string }
        author: { $ref: '#/components/schemas/PhotoAuthor' }
        authorUserId: { type: string }
        localDay: { $ref: '#/components/schemas/LocalDay' }
        isDaily: { type: boolean }
        status: { $ref: '#/components/schemas/PhotoStatus' }
        phraseKey: { type: [string, 'null'] }
        phrase: { type: [string, 'null'], maxLength: 80 }
        width: { type: integer }
        height: { type: integer }
        createdAt: { type: string, format: date-time }
        urls: { anyOf: [{ $ref: '#/components/schemas/PhotoUrls' }, { type: 'null' }], description: 'Null while pending.' }
    PhotoCreateRequest:
      type: object
      required: [clientId, contentType, bytes, thumbContentType, thumbBytes, width, height, localDay, timeZone]
      properties:
        clientId: { type: string, format: uuid, description: 'Idempotency key generated on the device.' }
        contentType: { $ref: '#/components/schemas/PhotoContentType' }
        bytes: { type: integer, minimum: 1, maximum: 2097152, description: 'Full image size (≤ 2 MB; target ~200 KB).' }
        thumbContentType: { $ref: '#/components/schemas/PhotoContentType' }
        thumbBytes: { type: integer, minimum: 1, maximum: 262144 }
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }
        localDay: { $ref: '#/components/schemas/LocalDay' }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        phraseKey: { type: string, description: 'Key from the Japanese phrase list (app/photo-moments.js).' }
        phrase: { type: string, maxLength: 80, description: 'Custom short phrase; ignored when phraseKey is set.' }
    PresignedUpload:
      type: object
      required: [method, url, headers, expiresAt]
      properties:
        method: { type: string, description: 'Always `PUT`.' }
        url: { type: string, format: uri }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Send exactly these headers (Content-Type, Content-Length) or the signature fails.
        expiresAt: { type: string, format: date-time }
    ProfilePatch:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80, description: 'Trimmed; inner whitespace collapsed; control characters rejected.' }
    Avatar:
      type: object
      required: [id, urls, updatedAt]
      description: A profile photo. `urls` are presigned GETs of the private bucket (24 h), like photos; cache by `id`.
      properties:
        id: { type: string }
        urls: { $ref: '#/components/schemas/PhotoUrls' }
        updatedAt: { type: string, format: date-time }
    AvatarUploadRequest:
      type: object
      required: [contentType, bytes, thumbContentType, thumbBytes, width, height]
      properties:
        contentType: { $ref: '#/components/schemas/PhotoContentType' }
        bytes: { type: integer, minimum: 1, maximum: 1048576, description: 'Full image size (1 MB or less).' }
        thumbContentType: { $ref: '#/components/schemas/PhotoContentType' }
        thumbBytes: { type: integer, minimum: 1, maximum: 131072, description: 'Thumbnail size (128 KB or less).' }
        width: { type: integer, minimum: 1, maximum: 2048 }
        height: { type: integer, minimum: 1, maximum: 2048 }
    AvatarUploadResponse:
      type: object
      required: [avatarId, upload]
      properties:
        avatarId: { type: string }
        upload: { $ref: '#/components/schemas/PhotoUploadTargets' }
    AvatarCompleteRequest:
      type: object
      required: [avatarId]
      properties:
        avatarId: { type: string }
    PhotoUploadTargets:
      type: object
      required: [full, thumb]
      properties:
        full: { $ref: '#/components/schemas/PresignedUpload' }
        thumb: { $ref: '#/components/schemas/PresignedUpload' }
    PhotoCreateResponse:
      type: object
      required: [photo, upload]
      properties:
        photo: { $ref: '#/components/schemas/Photo' }
        upload: { $ref: '#/components/schemas/PhotoUploadTargets' }
    PartnerState:
      type: string
      enum: [busy, free, unknown]
    PartnerStatus:
      type: object
      required: [state, busyUntil, freeUntil, title, syncedAt]
      description: '"Busy until 3 PM" is formatted on the client from `busyUntil` + the partner time zone.'
      properties:
        state: { $ref: '#/components/schemas/PartnerState' }
        busyUntil: { type: [string, 'null'], format: date-time }
        freeUntil: { type: [string, 'null'], format: date-time, description: 'Start of the next busy block within the window.' }
        title: { type: [string, 'null'], description: 'Current event title, only if opted in and Premium.' }
        syncedAt: { type: [string, 'null'], format: date-time }
    NudgeState:
      type: object
      required: [lastSentAt, lastReceivedAt, nextAllowedAt]
      properties:
        lastSentAt: { type: [string, 'null'], format: date-time }
        lastReceivedAt: { type: [string, 'null'], format: date-time }
        nextAllowedAt: { type: [string, 'null'], format: date-time }
    TodaySelf:
      type: object
      required: [displayName, localDay, timeZone, dailyPhoto, photoCount]
      properties:
        displayName: { type: string }
        localDay: { $ref: '#/components/schemas/LocalDay' }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        dailyPhoto: { anyOf: [{ $ref: '#/components/schemas/Photo' }, { type: 'null' }] }
        photoCount: { type: integer, description: 'Ready photos I took on my local day.' }
        weather: { anyOf: [{ $ref: '#/components/schemas/WeatherSummary' }, { type: 'null' }], description: 'My last reported weather (null when older than 12 h or never reported). Optional: absent on older servers.' }
        avatar: { anyOf: [{ $ref: '#/components/schemas/Avatar' }, { type: 'null' }], description: 'My profile photo (null when none). In-app only; widgets ignore it. Optional: absent on older servers.' }
    TodayPartner:
      type: object
      required: [userId, displayName, timeZone, utcOffsetMinutes, localDay, dailyPhoto, latestPhoto, photoCount, status]
      properties:
        userId: { type: string }
        displayName: { type: string }
        timeZone: { anyOf: [{ $ref: '#/components/schemas/TimeZoneId' }, { type: 'null' }] }
        utcOffsetMinutes: { type: [integer, 'null'] }
        localDay: { anyOf: [{ $ref: '#/components/schemas/LocalDay' }, { type: 'null' }], description: 'Partner''s current day (null until their tz is known).' }
        dailyPhoto: { anyOf: [{ $ref: '#/components/schemas/Photo' }, { type: 'null' }] }
        latestPhoto: { anyOf: [{ $ref: '#/components/schemas/Photo' }, { type: 'null' }], description: 'Most recent ready photo (for the widget).' }
        photoCount: { type: integer }
        status: { anyOf: [{ $ref: '#/components/schemas/PartnerStatus' }, { type: 'null' }], description: 'Null when not Premium or never synced.' }
        weather: { anyOf: [{ $ref: '#/components/schemas/WeatherSummary' }, { type: 'null' }], description: 'Partner''s last reported weather (null when older than 12 h or never reported). Optional: absent on older servers.' }
        avatar: { anyOf: [{ $ref: '#/components/schemas/Avatar' }, { type: 'null' }], description: 'Partner''s profile photo (null when none). In-app only; widgets ignore it. Optional: absent on older servers.' }
    WeatherCondition:
      type: string
      enum: [clear, partly_cloudy, cloudy, fog, drizzle, rain, snow, thunderstorm]
    WeatherSummary:
      type: object
      required: [condition, temperatureC, isDay, observedAt]
      description: Coarse current weather where a person is. No place name and no coordinates are ever stored.
      properties:
        condition: { $ref: '#/components/schemas/WeatherCondition' }
        temperatureC: { type: integer, minimum: -90, maximum: 60, description: 'Rounded air temperature in Celsius.' }
        isDay: { type: boolean }
        observedAt: { type: string, format: date-time, description: 'When the device read it (at most 6 h in the past).' }
    Today:
      type: object
      required: [generatedAt, me, partner, startedOn, daysTogether, reunion, activeTrip, nudges, entitlement]
      properties:
        generatedAt: { type: string, format: date-time }
        me: { $ref: '#/components/schemas/TodaySelf' }
        partner: { $ref: '#/components/schemas/TodayPartner' }
        startedOn: { anyOf: [{ $ref: '#/components/schemas/LocalDay' }, { type: 'null' }] }
        daysTogether: { type: [integer, 'null'] }
        reunion: { anyOf: [{ $ref: '#/components/schemas/Reunion' }, { type: 'null' }] }
        activeTrip: { anyOf: [{ $ref: '#/components/schemas/Trip' }, { type: 'null' }], description: 'Next trip whose Live Activity window is open or opens within 24h.' }
        nudges: { $ref: '#/components/schemas/NudgeState' }
        entitlement: { $ref: '#/components/schemas/Entitlement' }
        streak: { $ref: '#/components/schemas/CoupleStreak' }
        unseenMilestones:
          type: array
          items: { $ref: '#/components/schemas/Milestone' }
          description: 'Milestones I have not seen yet (oldest first), so the app can show the CelebrationSheet without another call. Usually empty.'
    CoupleStreak:
      type: object
      required: [current, best, todayComplete, meDoneToday, partnerDoneToday, lastCompleteDay]
      description: |
        Couple streak (Free): consecutive days on which both partners have a ready photo on that local day
        (each photo counts on its photographer's own local day, as in `me.localDay` / `partner.localDay`).
        A day only breaks the streak once it is over for both of us, so the partner who is a day ahead never
        sees a reset before the other one could post. `current` is 0 once a day passes without both photos.
      properties:
        current: { type: integer, minimum: 0 }
        best: { type: integer, minimum: 0, description: 'Longest streak this couple ever had (kept even if photos are later deleted).' }
        todayComplete: { type: boolean, description: '`meDoneToday && partnerDoneToday`.' }
        meDoneToday: { type: boolean, description: 'I have a ready photo on my local day (same day as `me.dailyPhoto`).' }
        partnerDoneToday: { type: boolean, description: 'My partner has a ready photo on their local day (false while their zone is unknown).' }
        lastCompleteDay: { anyOf: [{ $ref: '#/components/schemas/LocalDay' }, { type: 'null' }], description: 'Most recent day with both photos.' }
    MilestoneType:
      type: string
      enum: [first_photo, days_together, anniversary, reunion, streak]
    Milestone:
      type: object
      required: [id, type, value, localDay, achievedAt, seenAt]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/MilestoneType' }
        value: { type: [integer, 'null'], description: '`days_together`: 100; `anniversary`: years; `streak`: 7, 30 or 100; otherwise null.' }
        localDay: { $ref: '#/components/schemas/LocalDay' }
        achievedAt: { type: string, format: date-time, description: 'When the server recorded it.' }
        seenAt: { type: [string, 'null'], format: date-time, description: 'When I marked it seen (per user).' }
    MilestoneList:
      type: object
      required: [milestones]
      properties:
        milestones: { type: array, items: { $ref: '#/components/schemas/Milestone' } }
    PhotoThumb:
      type: object
      required: [photoId, thumbUrl, expiresAt]
      properties:
        photoId: { type: string }
        thumbUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    MemoryDaySummary:
      type: object
      required: [day, locked, photoCount, me, partner]
      properties:
        day: { $ref: '#/components/schemas/LocalDay' }
        locked: { type: boolean, description: 'True when outside the Free 7-day window.' }
        photoCount: { type: integer }
        me: { anyOf: [{ $ref: '#/components/schemas/PhotoThumb' }, { type: 'null' }], description: 'My daily photo thumb (null if none or locked).' }
        partner: { anyOf: [{ $ref: '#/components/schemas/PhotoThumb' }, { type: 'null' }] }
    MemoriesMonth:
      type: object
      required: [month, historyLimitDays, days]
      properties:
        month: { $ref: '#/components/schemas/YearMonth' }
        historyLimitDays: { type: [integer, 'null'], description: '7 on Free, null on Premium.' }
        days: { type: array, items: { $ref: '#/components/schemas/MemoryDaySummary' }, description: 'Only days with at least one photo, ascending.' }
    MemoryDay:
      type: object
      required: [day, photos]
      properties:
        day: { $ref: '#/components/schemas/LocalDay' }
        photos: { type: array, items: { $ref: '#/components/schemas/Photo' } }
    DeviceKind:
      type: string
      enum: [fcm, apns_alert, apns_widget]
    PushEnv:
      type: string
      enum: [sandbox, production]
    DeviceRegistration:
      type: object
      required: [installationId, kind, token, platform, appVersion]
      properties:
        installationId: { type: string, maxLength: 64, description: 'Random id generated on first launch, kept in secure storage.' }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        token: { type: string, maxLength: 4096 }
        env: { $ref: '#/components/schemas/PushEnv' }
        platform: { $ref: '#/components/schemas/AuthPlatform' }
        appVersion: { type: string, maxLength: 32 }
        osVersion: { type: string, maxLength: 32 }
        locale: { type: string, maxLength: 16 }
    Device:
      type: object
      required: [id, kind, platform, env, createdAt, lastSeenAt]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        platform: { $ref: '#/components/schemas/AuthPlatform' }
        env: { anyOf: [{ $ref: '#/components/schemas/PushEnv' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    LiveActivityTokenKind:
      type: string
      enum: [push_to_start, update]
    LiveActivityTokenRequest:
      type: object
      required: [installationId, kind, token, env]
      properties:
        installationId: { type: string, maxLength: 64 }
        kind: { $ref: '#/components/schemas/LiveActivityTokenKind' }
        token: { type: string, maxLength: 4096, description: 'Hex-encoded APNs token.' }
        env: { $ref: '#/components/schemas/PushEnv' }
        activityId: { type: string, description: 'Required for `update`.' }
        tripId: { type: string, description: 'Required for `update` (from the activity attributes).' }
    LiveActivityToken:
      type: object
      required: [id, kind, activityId, tripId, createdAt]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/LiveActivityTokenKind' }
        activityId: { type: [string, 'null'] }
        tripId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    BusyBlockInput:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        allDay: { type: boolean, description: 'Dropped by the server if true (all-day never counts as busy).' }
        title: { type: string, maxLength: 200, description: 'Only for opted-in calendars; truncated to 80.' }
        calendarRef: { type: string, maxLength: 64, description: 'Opaque device-side hash of the calendar id (Pigeon `CalendarInfo.ref`).' }
        isPrivate: { type: boolean, description: 'OS-level private event; the title is never stored.' }
    CalendarBusyUpload:
      type: object
      required: [from, to, timeZone, blocks]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: '≤ from + 14 days.' }
        timeZone: { $ref: '#/components/schemas/TimeZoneId' }
        blocks: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/BusyBlockInput' } }
    CalendarBusyResult:
      type: object
      required: [syncedAt, stored, ignoredAllDay, droppedTitles]
      properties:
        syncedAt: { type: string, format: date-time }
        stored: { type: integer }
        ignoredAllDay: { type: integer }
        droppedTitles: { type: integer }
    CalendarBlock:
      type: object
      required: [start, end, title]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        title: { type: [string, 'null'] }
    CalendarSide:
      type: object
      required: [timeZone, syncedAt, blocks]
      properties:
        timeZone: { anyOf: [{ $ref: '#/components/schemas/TimeZoneId' }, { type: 'null' }] }
        syncedAt: { type: [string, 'null'], format: date-time, description: '"Updated 2h ago"; null = never synced.' }
        blocks: { type: array, items: { $ref: '#/components/schemas/CalendarBlock' } }
    CalendarView:
      type: object
      required: [from, to, me, partner, partnerStatus]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        me: { $ref: '#/components/schemas/CalendarSide' }
        partner: { $ref: '#/components/schemas/CalendarSide' }
        partnerStatus: { $ref: '#/components/schemas/PartnerStatus' }
    CalendarShare:
      type: object
      required: [calendarRef, displayName, shareTitles]
      properties:
        calendarRef: { type: string, maxLength: 64 }
        displayName: { type: [string, 'null'], maxLength: 80, description: 'Shown only to me (Settings).' }
        shareTitles: { type: boolean }
    CalendarShareInput:
      type: object
      required: [calendarRef, shareTitles]
      properties:
        calendarRef: { type: string, maxLength: 64 }
        displayName: { type: string, maxLength: 80 }
        shareTitles: { type: boolean }
    CalendarSharesUpdate:
      type: object
      required: [calendars]
      properties:
        calendars: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/CalendarShareInput' } }
    CalendarShares:
      type: object
      required: [calendars]
      properties:
        calendars: { type: array, items: { $ref: '#/components/schemas/CalendarShare' } }
